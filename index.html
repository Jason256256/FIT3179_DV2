<!DOCTYPE html>
<html>

<head>
    <title>Early Childhood Education</title>
    <!-- Import Vega & Vega-Lite (does not have to be from CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.20.2"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.1.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.17.0"></script>

    <!-- Import pure.css -->
    <link rel="stylesheet" href="https://unpkg.com/purecss@2.0.3/build/pure-min.css" integrity="sha384-cg6SkqEOCV1NbJoCu11+bm0NvBRc8IYLRGXkmNrqUBfTjmMYwNKPWBTIKyw9mHNJ" crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Google font -->
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;700;900&display=swap" rel="stylesheet">

    <!-- CSS file -->
    <link rel="stylesheet" type="text/css" href="css/style.css" media="all">


</head>

<body>

  <section class="dashboard-section" id="section-1">
    <div class="narrative-box">
      <h2>Section 1: Enrolment Rates in Australia</h2>
      <p>Exploring early childhood education uptake across remoteness communities, gender divergence via difference mapping, and state-level geographic disparities.</p>
    
      <!-- Per-Section Year Slider Control -->
      <div class="control-group">
        <label for="s1-slider">Select Year: <span id="s1-year-val">2021</span></label>
        <input type="range" id="s1-slider" min="2016" max="2026" step="2" value="2021">
      </div>
    </div>

    <div class="charts-row">
      <div id="vis1" class="chart-container"></div>
      <div id="vis2" class="chart-container"></div>
      <div id="vis3" class="chart-container"></div>
    </div>
  </section>

  <script>
    // Embedding Vega-Lite specs with reactive signals for the year slider
    const slider = document.getElementById('s1-slider');
    const yearVal = document.getElementById('s1-year-val');

    function renderSection1(year) {
      yearVal.textContent = year;
      const vizParams = {
        usermeta: {},
        eval: { section1_year: parseInt(year) }
      };
    
      vegaEmbed('#vis1', 'js/idiom1_bar.vg.json', {mod: vizParams});
      vegaEmbed('#vis2', 'js/idiom2_dac.vg.json');
      vegaEmbed('#vis3', 'js/idiom3_map.vg.json', {mod: vizParams});
    }

    slider.addEventListener('input', (e) => renderSection1(e.target.value));
    renderSection1(2021); // Initial load
  </script>
</body>

</html>
